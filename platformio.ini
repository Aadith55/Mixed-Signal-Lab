; MixedSignalLab - ESP32-WROOM-32 + ILI9341 240x320
; Seven independently selectable PlatformIO environments.

[platformio]
default_envs = tft_hello

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    bodmer/TFT_eSPI@2.5.43

; TFT_eSPI configuration. GPIO33 is used for CS to avoid strapping GPIO5.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=33
    -D TFT_DC=21
    -D TFT_RST=22
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
    -D CORE_DEBUG_LEVEL=0

[env:tft_hello]
build_src_filter =
    +<main.cpp>
    +<hello_screen.cpp>
build_flags =
    ${env.build_flags}
    -D APP_TFT_HELLO=1

[env:dac_adc_loopback]
build_src_filter =
    +<main.cpp>
    +<loopback_test.cpp>
build_flags =
    ${env.build_flags}
    -D APP_DAC_ADC_LOOPBACK=1

[env:adc_characterization]
build_src_filter =
    +<main.cpp>
    +<adc_characterization.cpp>
build_flags =
    ${env.build_flags}
    -D APP_ADC_CHARACTERIZATION=1

[env:spectrum_analyzer]
build_src_filter =
    +<main.cpp>
    +<spectrum_analyzer.cpp>
build_flags =
    ${env.build_flags}
    -D APP_SPECTRUM_ANALYZER=1

[env:pwm_generator]
build_src_filter =
    +<main.cpp>
    +<pwm_generator.cpp>
build_flags =
    ${env.build_flags}
    -D APP_PWM_GENERATOR=1

[env:harmonic_comparison]
build_src_filter =
    +<main.cpp>
    +<harmonic_comparison.cpp>
build_flags =
    ${env.build_flags}
    -D APP_HARMONIC_COMPARISON=1

[env:pcnt_frequency]
build_src_filter =
    +<main.cpp>
    +<pcnt_frequency.cpp>
build_flags =
    ${env.build_flags}
    -D APP_PCNT_FREQUENCY=1
